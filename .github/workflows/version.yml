name: Auto Bump Version

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: version-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-bump-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify branch before bumping version
        run: npm run ci

      - name: Select bump type
        id: bump_type
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "bump_type=minor" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "bump_type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported version bump branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Bump version
        id: bump_version
        run: npm run version:bump -- ${{ steps.bump_type.outputs.bump_type }}

      - name: Commit and push version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add package.json package-lock.json CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi

          git commit -m "chore(version): bump version to v${{ steps.bump_version.outputs.new_version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
