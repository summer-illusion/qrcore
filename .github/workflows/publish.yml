name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, such as v0.1.0. Leave empty to publish the checked out main version.'
        required: false
        type: string
      npm_tag:
        description: 'NPM dist tag'
        required: false
        default: latest
        type: choice
        options:
          - latest
          - beta

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || 'main' }}
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release ref
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          INPUT_TAG="${{ github.event.inputs.tag || '' }}"

          if [[ "${{ github.event.inputs.npm_tag }}" = "latest" && "$PACKAGE_VERSION" == *-* ]]; then
            echo "Latest releases must use a stable version, got $PACKAGE_VERSION."
            exit 1
          fi

          if [ -n "$INPUT_TAG" ]; then
            TAG_VERSION="${INPUT_TAG#v}"
            if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "Release tag $INPUT_TAG does not match package.json version $PACKAGE_VERSION."
              exit 1
            fi

            git fetch origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$INPUT_TAG" origin/main; then
              echo "Release tag $INPUT_TAG must point to a commit contained in origin/main."
              exit 1
            fi
          fi

      - name: Prepare unscoped NPM package name
        run: npm run publish:prepare

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test built package
        run: npm run smoke

      - name: Verify packed package contents
        run: npm run pack:dry

      - name: Publish to NPM
        run: npm publish --tag ${{ github.event.inputs.npm_tag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
